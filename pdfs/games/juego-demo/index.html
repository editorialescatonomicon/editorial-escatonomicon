<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego HTML demo · Editorial Escatonomicón</title>
  <style>
    html, body { margin:0; height:100%; background:#000; color:#f5efe6; font-family: Georgia, serif; }
    main { min-height:100%; display:grid; place-items:center; padding:2rem; box-sizing:border-box; }
    .panel { width:min(760px, 100%); border:1px solid #d2a55d; padding:2rem; text-align:center; }
    h1 { font-size:clamp(2rem, 7vw, 4rem); margin:.2rem 0; }
    p { color:#d4c4b2; font-size:1.2rem; }
    button { margin-top:1rem; padding:.8rem 1.2rem; border:1px solid #d2a55d; background:#111; color:#f5efe6; cursor:pointer; }
    #log { margin-top:1.5rem; color:#9fdb9f; font-family: monospace; min-height:3rem; }
  </style>
</head>
<body>
  <main>
    <section class="panel">
      <p>Editorial Escatonomicón presenta</p>
      <h1>Juego HTML demo</h1>
      <p>Sustituye esta carpeta por el juego real exportado en HTML.</p>
      <button id="play">Iniciar</button>
      <div id="log"></div>
    </section>
  </main>
  <script>
    const log = document.getElementById('log');
    document.getElementById('play').addEventListener('click', () => {
      log.textContent = '> el umbral responde. La versión real del juego irá aquí.';
    });
  </script>
</body>
</html>
